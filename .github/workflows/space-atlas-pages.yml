# Builds space-atlas/ and publishes it to GitHub Pages:
#   https://xuanthang2505.github.io/XuanThang2505/
# Pages is switched on by the configure-pages step below (enablement: true). If GitHub refuses
# (the token may lack admin rights), do it by hand once: Settings → Pages → Source: "GitHub Actions".
name: Deploy Space Atlas to GitHub Pages

on:
  push:
    branches: [claude/project-portfolio-manager-afdmap]
    paths: ['space-atlas/**', '.github/workflows/space-atlas-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: space-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: space-atlas/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: space-atlas/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
